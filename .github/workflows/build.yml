
name: BATTLE-ROYALE-MAX APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Gradle Version
        id: gradle-version
        shell: bash
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            VERSION=$(grep 'distributionUrl=' gradle/wrapper/gradle-wrapper.properties | grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 | sed 's/gradle-//')
          fi
          VERSION=${VERSION:-8.9}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload Game APK
        uses: actions/upload-artifact@v4
        with:
          name: BATTLE-ROYALE-MAX-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
