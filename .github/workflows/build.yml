name: Build Flutter APK

on:
  push:
    branches: [ main ] # আপনার প্রজেক্টের ব্রাঞ্চ মেইন (main) না হলে এখানে সেই ব্রাঞ্চের নাম দিন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # আপনার প্রজেক্টের ফ্লাটার ভার্সন অনুযায়ী এটি পরিবর্তন করতে পারেন
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: build/app/outputs/apk/release/app-release.apk
